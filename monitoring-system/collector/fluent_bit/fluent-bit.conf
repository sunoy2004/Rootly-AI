[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf

[INPUT]
    Name              tail
    Path              /logs/*.log
    Parser            json
    Tag               api.logs
    DB                /data/flb_pos.db
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    Refresh_Interval  10

[FILTER]
    Name    record_modifier
    Match   api.logs
    Record  environment development

[OUTPUT]
    Name            es
    Match           api.logs
    Host            elasticsearch
    Port            9200
    Index           api-logs
    Logstash_Format On
    Logstash_Prefix api-logs
    Retry_Limit     5
    Trace_Error     On
